name: Bug report / 使用问题
description: 用虚构数据复现导入、分级、证据或本机保存问题。
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        请先尝试仓库内的虚构样例。不要上传真实询盘、客户名单、联系人资料、备份、API Key、Cookie 或登录截图。补充示例时使用 example.com 或 .example 域名。
  - type: input
    id: environment
    attributes:
      label: Node.js 和浏览器版本
    validations:
      required: true
  - type: dropdown
    id: sample
    attributes:
      label: 复现数据
      options:
        - 仓库内虚构样例
        - 自建最小虚构 CSV / JSON
        - 不涉及数据导入
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 操作步骤
      description: 写清点击的按钮、列映射和涉及的流程；不要附真实客户数据。
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected_actual
    attributes:
      label: 期望结果与实际结果
      placeholder: |
        期望：
        实际：
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: 公开反馈检查
      options:
        - label: 我只提供虚构复现数据，已移除客户资料、个人信息和凭据。
          required: true
